name: Tagged release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
      EXE_SUFFIX: ${{ matrix.suffix }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check tag and install the repository toolchain
        run: |
          python scripts/package_release.py check-version --tag "$RELEASE_TAG"
          rustup show
          rustup target add "$TARGET"
      - name: Test and build the native target
        run: |
          cargo test --locked --target "$TARGET" --all-targets
          python -m unittest discover -s scripts -p 'test_*.py' -v
          cargo build --locked --release --target "$TARGET"
          python scripts/acceptance.py --bin "target/$TARGET/release/zaccel$EXE_SUFFIX"
      - name: Package the built executable
        run: |
          python scripts/package_release.py package --binary "target/$TARGET/release/zaccel$EXE_SUFFIX" --target "$TARGET" --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/zaccel-artifacts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/zaccel-artifacts/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/zaccel-release
      - name: Check all archives and create release checksums
        run: python scripts/package_release.py checksums "$RUNNER_TEMP/zaccel-release" --expect-count 5
      - name: Publish the verified tag and its artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=( "$RUNNER_TEMP/zaccel-release/"* )
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$RELEASE_TAG" --generate-notes

  publish-crate:
    if: vars.ZACCEL_PUBLISH_CRATE == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify opt-in credentials and publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo 'CARGO_REGISTRY_TOKEN is required for the opted-in crates.io publication' >&2; exit 1; }
          python3 scripts/package_release.py check-version --tag "$RELEASE_TAG"
          cargo publish --locked
